[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reelplanner"
version = "0.1.0"
description = "Plan Instagram reels across several pages from the terminal"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Soham" }]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
reelplanner = "reelplanner.cli:main"

[tool.setuptools]
packages = ["reelplanner"]
